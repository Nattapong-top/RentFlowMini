
name: RentFlowMini CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    env:
      MSSQL_SA_PASSWORD: ${{ secrets.RENTFLOWMINI_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install SQL Server
        uses: potatoqualitee/mssqlsuite@v1.7
        with:
          install: sqlengine
          version: 2022
          sa-password: ${{ env.MSSQL_SA_PASSWORD }}

      - name: Verify SQL Server
        shell: pwsh
        run: |
          sqlcmd -S localhost -U sa -P "$env:MSSQL_SA_PASSWORD" `
            -Q "SELECT @@VERSION AS Version;"

      - name: Create test database
        shell: pwsh
        run: |
          sqlcmd -S localhost -U sa -P "$env:MSSQL_SA_PASSWORD" `
            -Q "IF DB_ID('RentFlowDb') IS NULL CREATE DATABASE RentFlowDb;"

      - name: Create tables
        shell: pwsh
        run: |
          sqlcmd -S localhost -U sa -P "$env:MSSQL_SA_PASSWORD" `
            -d RentFlowDb -i "\RentFlowApp\Database\001_CreateRooms.sql"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        env:
          RENTFLOW_TEST_CONNECTION: "Server=localhost;Database=RentFlowDb;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=True;"
        run: dotnet test --configuration Release --no-build --verbosity normal
